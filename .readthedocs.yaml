version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    # The docs toolchain lives in the [docs] extra of pyproject.toml, so this
    # build and a local `pip install -e ".[docs]"` resolve identically.
    - method: pip
      path: .
      extra_requirements:
        - docs
